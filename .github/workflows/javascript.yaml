%YAML 1.1
---
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/checkout@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: shikanime-labs/actions/nix/setup@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - id: direnv
      uses: shikanime-labs/actions/direnv@v9
    - uses: shikanime-labs/actions/pnpm/integration@v9
  build-workspace:
    name: Build (Workspace)
    runs-on: ubuntu-latest
    steps:
    - continue-on-error: true
      id: createGithubAppToken
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
        permission-contents: read
        private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
    - uses: shikanime-labs/actions/checkout@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - uses: shikanime-labs/actions/nix/setup@v9
      with:
        github-token: ${{ steps.createGithubAppToken.outputs.token || 
          secrets.GITHUB_TOKEN }}
    - id: direnv
      uses: shikanime-labs/actions/direnv@v9
    - uses: shikanime-labs/actions/pnpm/integration@v9
      with:
        recursive: true
name: JavaScript
'on':
  workflow_call:
    secrets:
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
permissions:
  contents: read
