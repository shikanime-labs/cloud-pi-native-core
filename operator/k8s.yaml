apiVersion: v1
kind: Namespace
metadata:
  name: cpn-operator-test
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zones.cpn.shikanime.studio
spec:
  group: cpn.shikanime.studio
  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    singular: zone
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [slug]
              properties:
                slug: { type: string, minLength: 1, maxLength: 10 }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.cpn.shikanime.studio
spec:
  group: cpn.shikanime.studio
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [zone, cluster, server, config, clusterResources]
              properties:
                zone: { type: string, minLength: 1 }
                cluster: { type: string, minLength: 1 }
                server: { type: string }
                config: { type: string }
                clusterResources: { type: boolean }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpn-operator
  namespace: cpn-operator-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpn-operator-crd-test
rules:
  - apiGroups: ["cpn.shikanime.studio"]
    resources: ["zones", "clusters", "projects", "adminroles"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["cpn.shikanime.studio"]
    resources: ["zones/status", "clusters/status", "projects/status", "adminroles/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpn-operator-crd-test
  namespace: cpn-operator-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpn-operator-crd-test
subjects:
  - kind: ServiceAccount
    name: cpn-operator
    namespace: cpn-operator-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpn-operator
  namespace: cpn-operator-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: cpn-operator }
  template:
    metadata:
      labels: { app: cpn-operator }
    spec:
      serviceAccountName: cpn-operator
      containers:
        - name: operator
          image: cpn-operator
          imagePullPolicy: IfNotPresent
