apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.cpn.shikanime.studio
spec:
  group: cpn.shikanime.studio
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [slug, name, description, owner, roles, members, environments]
              properties:
                slug: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                description: { type: string }
                owner: { type: string, format: email }
                roles:
                  type: array
                  items:
                    type: object
                    required: [name, permissions, position, oidcGroup, type]
                    properties:
                      name: { type: string, minLength: 1 }
                      permissions: { type: string, pattern: '^[0-9]+$' }
                      position: { type: integer }
                      oidcGroup: { type: string, minLength: 1 }
                      type: { type: string, enum: [managed, custom] }
                members:
                  type: array
                  items:
                    type: object
                    required: [roleIds]
                    properties:
                      email: { type: string, format: email }
                      userId: { type: string, minLength: 1 }
                      roleIds:
                        type: array
                        items: { type: string, minLength: 1 }
                    anyOf:
                      - required: [email]
                      - required: [userId]
                environments:
                  type: array
                  items:
                    type: object
                    required: [name, zoneSlug, clusterLabel, roUserEmails, rwUserEmails]
                    properties:
                      name: { type: string, minLength: 1 }
                      zoneSlug: { type: string, minLength: 1 }
                      clusterLabel: { type: string, minLength: 1 }
                      roUserEmails: { type: array, items: { type: string } }
                      rwUserEmails: { type: array, items: { type: string } }
                projectRootDir: { type: string }
                repositoryName: { type: string }
                externalRepoUrl: { type: string }
                clusterPrivacy: { type: string, enum: [public, dedicated] }
                npm: { type: boolean }
                storageLimitBytes: { type: number }
                robotDurationDays: { type: number }
                mirrorTokenExpirationDays: { type: number }
                mirrorRotationThresholdDays: { type: number }
                retention:
                  type: object
                  required: [template, count, cron]
                  properties:
                    template:
                      type: string
                      enum: [always, latestPulledK, latestPushedK, nDaysSinceLastPull, nDaysSinceLastPush]
                    count: { type: integer }
                    cron: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
