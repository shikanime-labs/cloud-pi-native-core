apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: adminroles.cpn.shikanime.studio
spec:
  group: cpn.shikanime.studio
  names:
    kind: AdminRole
    listKind: AdminRoleList
    plural: adminroles
    singular: adminrole
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [role, userEmails]
              properties:
                role:
                  type: object
                  required: [name, permissions, position, oidcGroup, type]
                  properties:
                    name: { type: string, minLength: 1 }
                    permissions: { type: string, pattern: '^[0-9]+$' }
                    position: { type: integer }
                    oidcGroup: { type: string, minLength: 1 }
                    type: { type: string, enum: [managed, custom] }
                userEmails: { type: array, items: { type: string } }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
